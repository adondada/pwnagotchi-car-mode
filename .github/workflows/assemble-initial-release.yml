name: Assemble initial Car Mode release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/assemble-initial-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Assemble and verify plugin
        shell: bash
        run: |
          cat \
            .release-parts/01.b64 \
            .release-parts/02a.b64 \
            .release-parts/02b.b64 \
            .release-parts/03a.b64 \
            .release-parts/03b.b64 \
            .release-parts/04.b64 \
            .release-parts/05.b64 \
            .release-parts/06.b64 \
            | base64 -d > car_mode.py

          echo "a05bbcdb3e3676a96408ce037929cba2cbda8a8f0273202b09355ebd4e876aa5  car_mode.py" | sha256sum -c -
          python -m py_compile car_mode.py

      - name: Publish source commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add car_mode.py
          git rm -r .release-parts
          git rm .github/workflows/assemble-initial-release.yml
          git commit -m "release: publish Car Mode v6.5.1"
          git push
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Create initial GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v6.5.1 >/dev/null 2>&1; then
            gh release upload v6.5.1 car_mode.py examples/config.toml --clobber
          else
            gh release create v6.5.1 \
              car_mode.py examples/config.toml \
              --target "$RELEASE_SHA" \
              --title "Pwnagotchi Car Mode v6.5.1" \
              --notes "First packaged release. Adds Wi-Fi/BLE/GPS sensor fusion, WebUI configuration, channel-lock improvements, AUTO fallback, and Bluetooth PAN/tether protection."
          fi
